html,body{margin:0;background:transparent}
*{box-sizing:border-box}
.shot{display:inline-block;margin:0 0 30px 0;vertical-align:top;position:relative}
.osw{font-family:Oswald;font-weight:700;text-transform:uppercase;letter-spacing:.2px;line-height:1.02}
.osw5{font-family:Oswald;font-weight:500;letter-spacing:.3px}
.sp{font-family:Spectral;font-weight:400}
.it{font-family:Spectral;font-style:italic;font-weight:400}
.dark{position:relative;overflow:hidden;border-radius:26px;color:#FFFFFF;
 background:
  radial-gradient(70% 90% at 62% -18%, #E0A21C 0%, rgba(0,0,0,0) 68%),
  radial-gradient(55% 70% at -6% 112%, #8A3A0E 0%, rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#5A3605 0%,#2A1702 100%);
 box-shadow:0 7px 14px rgba(0,0,0,.42), inset 0 0 0 1.5px rgba(255,214,140,.16);}
.dark .checks{position:absolute;top:0;right:0;bottom:0;width:42%;pointer-events:none;
 background:conic-gradient(rgba(255,226,160,.075) 25%,transparent 0 50%,rgba(255,226,160,.075) 0 75%,transparent 0) 0 0/34px 34px;
 -webkit-mask-image:linear-gradient(to left,rgba(0,0,0,1) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,0) 100%);}
.light{position:relative;overflow:hidden;border-radius:18px;color:#2B1B05;
 background-color:#FFFBF2;
 background-image:linear-gradient(#F5EBD2 1px,transparent 1px),linear-gradient(90deg,#F5EBD2 1px,transparent 1px);
 background-size:20px 20px;background-position:-1px -1px;
 box-shadow:0 5px 11px rgba(0,0,0,.30), inset 0 0 0 1px rgba(214,184,120,.35);}
.light .margin{position:absolute;left:30px;top:0;bottom:0;width:2px;background:#F4C25A;opacity:.85}
.tag{display:inline-block;font-family:Oswald;font-weight:600;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;
 padding:4px 9px 3px;border-radius:7px;line-height:1.15}
.pill{display:inline-flex;align-items:center;gap:7px;font-family:Oswald;font-weight:600;font-size:17px;letter-spacing:.3px;
 border-radius:999px;padding:7px 16px 7px;line-height:1}

:root{color-scheme:normal}
html,body{height:100%;overflow:hidden;background:transparent!important}
#stage{width:688px;height:318px;padding:14px;transform-origin:0 0}
.book{position:absolute;display:block;z-index:2;cursor:pointer;transform-origin:50% 100%;
  transition:transform .45s cubic-bezier(.2,.9,.25,1.25),filter .35s ease;outline:none}
.book .face{position:absolute;inset:0;border-radius:5px 5px 2px 2px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12);
  transition:box-shadow .35s ease}
.book i{position:absolute;left:0;right:0;height:4px}
.book b{position:absolute;left:0;right:0;top:24px;bottom:24px;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.8px;white-space:nowrap;font-weight:600}
.book:hover,.book:focus-visible{transform:translateY(-12px) scale(1.06);z-index:5;filter:brightness(1.08)}
.book:hover .face,.book:focus-visible .face{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12),0 14px 18px rgba(0,0,0,.45),0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.book:active{transform:translateY(-6px) scale(1.03);transition-duration:.12s}
.hbook{transform-origin:0 100%;transform:rotate(-9deg)}
.hbook .face{box-shadow:0 0 22px rgba(252,188,68,.75),inset 0 0 0 1.5px rgba(0,0,0,.12)}
.hbook:hover,.hbook:focus-visible{transform:rotate(-6deg) translate(0,-10px) scale(1.05)}
.hbook:hover .face{box-shadow:0 0 34px rgba(252,188,68,.95),0 14px 18px rgba(0,0,0,.45)}
.ghost{position:absolute;z-index:1;transition:transform .5s cubic-bezier(.2,.9,.25,1.25);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{translate:0 -5px}}
#card:has(.hbook:hover) .ghost{transform:translate(16px,-2px) rotate(10deg)}
.locked{position:absolute;width:26px;height:150px;border-radius:4px;cursor:not-allowed;
  box-shadow:inset 0 0 0 1.6px color-mix(in srgb,var(--c) 53%,transparent);
  background:repeating-linear-gradient(180deg,transparent 0 6px,rgba(255,255,255,.03) 6px 12px);transition:background .3s}
.locked .lock{position:absolute;left:7px;top:12px;opacity:.6}
.locked:hover{background:repeating-linear-gradient(180deg,transparent 0 6px,rgba(255,255,255,.07) 6px 12px)}
.locked:hover .lock{animation:jiggle .45s ease}
@keyframes jiggle{20%{transform:rotate(-14deg)}45%{transform:rotate(11deg)}70%{transform:rotate(-6deg)}}
.plank{position:absolute;height:14px;border-radius:3px;background:linear-gradient(180deg,#8A5E1A,#5E3E0E);box-shadow:0 8px 12px rgba(0,0,0,.35);z-index:3}
